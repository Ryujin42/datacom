spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    root: INFO
    com.datacom: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  file:
    name: /var/log/datacom/datacom.log
