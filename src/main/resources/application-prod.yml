spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true

# ECO-13 : INFO en production, SQL desactive (il double le volume de journaux sans rien apporter
# une fois l'application stabilisee). La rotation (quotidienne/10 Mo, retention 30 jours) est
# definie dans log4j2.properties ; "logging.file.name" ci-dessous ne fait qu'y injecter le chemin
# via la propriete systeme LOG_FILE (mecanisme Spring Boot, valable quel que soit le moteur de logs).
logging:
  level:
    root: INFO
    com.datacom: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  file:
    name: /var/log/datacom/datacom.log
