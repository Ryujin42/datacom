spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    show-sql: false

server:
  servlet:
    session:
      cookie:
        secure: true

# ECO-13 : INFO en production, SQL desactive (il double le volume de journaux sans rien apporter
# une fois l'application stabilisee), et rotation a 30 jours pour que les journaux ne croissent pas
# indefiniment sur le disque.
logging:
  level:
    root: INFO
    com.datacom: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  file:
    name: /var/log/datacom/datacom.log
  logback:
    rollingpolicy:
      file-name-pattern: /var/log/datacom/datacom-%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
      max-file-size: 10MB
      total-size-cap: 500MB
