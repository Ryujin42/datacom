<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Changer mon mot de passe')}"></th:block>
</head>
<body>
<main id="contenu">
    <h1>Changer mon mot de passe</h1>

    <p role="alert" class="form-error" th:if="${errorMessage}" th:text="${errorMessage}">Erreur</p>
    <p role="status" th:if="${successMessage}" th:text="${successMessage}">OK</p>
    <p>Le nouveau mot de passe doit comporter au moins <span th:text="${minLength}">12</span> caractères
        et ne pas figurer parmi les mots de passe les plus courants.</p>

    <form method="post" th:action="@{/password/change}">
        <div class="form-field">
            <label for="currentPassword">Mot de passe actuel</label>
            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password" required="required"/>
        </div>
        <div class="form-field">
            <label for="newPassword">Nouveau mot de passe</label>
            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required="required"/>
        </div>
        <button type="submit">Valider</button>
    </form>

    <p><a th:href="@{/}">Retour à l'accueil</a></p>
</main>
</body>
</html>
