<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Erreur')}"></th:block>
</head>
<body>
<main class="error-page">
    <p class="status-code" th:text="${status}">Erreur</p>
    <h1>Une erreur est survenue</h1>
    <p th:if="${correlationId}">
        Référence : <span class="correlation-id" th:text="${correlationId}">correlation-id</span>
    </p>
    <p><a th:href="@{/}">Retour à l'accueil</a></p>
</main>
</body>
</html>
