<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Accueil — DataCom</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<header class="app-header">
    <img th:src="@{/img/datacom.webp}" alt="DataCom"/>
    <span th:text="${firstname} + ' ' + ${lastname} + ' — ' + ${role}">Utilisateur</span>
    <form method="post" th:action="@{/logout}" style="margin-left:auto">
        <button type="submit">Se déconnecter</button>
    </form>
</header>
<main>
    <h1>Bienvenue, <span th:text="${firstname}">Prénom</span></h1>

    <!-- US-05 CA-1 : la creation est un POST, jamais une simple navigation (corrige B6). -->
    <form method="post" th:action="@{/fiches}" th:if="${role.name() == 'OPERATOR'}">
        <button type="submit">Créer une fiche produit</button>
    </form>

    <p th:if="${role.name() == 'VALIDATOR'}">
        <a th:href="@{/controle}">Fiches à contrôler</a>
    </p>

    <p><a th:href="@{/password/change}">Changer mon mot de passe</a></p>
</main>
</body>
</html>
