<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Accueil')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: pageHeader}"></header>

<main id="contenu">
    <h1>Bienvenue, <span th:text="${firstname}">Prénom</span></h1>

    <section th:if="${role.name() == 'OPERATOR'}">
        <h2>Mes fiches</h2>
        <p>
            Vous avez
            <strong th:text="${counts.myDrafts}">0</strong>
            fiche(s) en cours de saisie.
        </p>
        <ul>
            <li><a th:href="@{/fiches}">Consulter mes fiches</a></li>
        </ul>
        <form method="post" th:action="@{/fiches}">
            <button type="submit">Créer une fiche produit</button>
        </form>
    </section>

    <section th:if="${role.name() == 'VALIDATOR'}">
        <h2>Contrôle de conformité</h2>
        <p>
            <strong th:text="${counts.awaitingReview}">0</strong>
            fiche(s) en attente de contrôle.
        </p>
        <ul>
            <li><a th:href="@{/controle}">Fiches à contrôler</a></li>
            <li><a th:href="@{/fiches}">Consulter toutes les fiches</a></li>
            <li><a th:href="@{/fiches/recherche}">Rechercher une fiche</a></li>
            <li><a th:href="@{/journal}">Journal de mes décisions</a></li>
        </ul>
    </section>

    <p><a th:href="@{/password/change}">Changer mon mot de passe</a></p>
</main>
</body>
</html>
