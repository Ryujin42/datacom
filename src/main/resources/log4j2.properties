status = warn
name = DataComLog4j2Config

# Pattern : date (millisecondes), id de correlation (QUA-05), niveau, classe#methode d'origine, message.
property.LOG_PATTERN = %d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:---}] %-5level %C{1}#%M - %msg%n
property.LOG_FILE_PATH = ${sys:LOG_FILE:-logs/datacom.log}

# --- Sorties (appenders) ---
appender.console.type = Console
appender.console.name = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${LOG_PATTERN}

# ECO-13 : rotation quotidienne ou a 10 Mo, retention 30 jours, compression gzip.
appender.rolling.type = RollingFile
appender.rolling.name = FILE
appender.rolling.fileName = ${LOG_FILE_PATH}
appender.rolling.filePattern = ${LOG_FILE_PATH}-%d{yyyy-MM-dd}.%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${LOG_PATTERN}
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 10MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.delete.type = Delete
appender.rolling.strategy.delete.basePath = ${sys:LOG_PATH:-logs}
appender.rolling.strategy.delete.maxDepth = 1
appender.rolling.strategy.delete.ifLastModified.type = IfLastModified
appender.rolling.strategy.delete.ifLastModified.age = 30d
appender.rolling.strategy.delete.ifFileName.type = IfFileName
appender.rolling.strategy.delete.ifFileName.glob = *.log.gz

# --- Domaines (un logger par module metier, cf. architecture en couches / ArchitectureTest) ---
logger.product.name = com.datacom.product
logger.product.level = DEBUG

logger.user.name = com.datacom.user
logger.user.level = DEBUG

logger.audit.name = com.datacom.audit
logger.audit.level = DEBUG

logger.common.name = com.datacom.common
logger.common.level = DEBUG

# Bruit du framework : silencieux par defaut, "logging.level.*" (application-*.yml) le reactive au besoin.
logger.hibernateSql.name = org.hibernate.SQL
logger.hibernateSql.level = WARN

logger.hibernateBind.name = org.hibernate.orm.jdbc.bind
logger.hibernateBind.level = WARN

rootLogger.level = INFO
rootLogger.appenderRef.console.ref = CONSOLE
rootLogger.appenderRef.file.ref = FILE
