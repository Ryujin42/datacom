name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvn verify runs: compile -> unit tests (Surefire) -> integration tests via
      # Testcontainers (Failsafe) -> Checkstyle -> JaCoCo coverage report (QUA-01/02/03).
      - name: Build, test, static analysis
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build container image
        run: docker build -t datacom:ci .

      # SEC-12 : analyse des vulnerabilites a chaque integration, bloquante sur « critique ».
      #
      # Analyser l'image plutot que le seul arbre de dependances Maven couvre les deux couches en
      # une passe : Trivy inspecte les dependances Java embarquees dans le jar *et* les paquets du
      # systeme de base, que la premiere approche ne verrait jamais.
      #
      # ignore-unfixed : une vulnerabilite sans correctif disponible ne peut pas etre corrigee en
      # mettant a jour ; bloquer la construction dessus rendrait la CI rouge en permanence sans
      # qu'aucune action ne soit possible.
      #
      # OWASP dependency-check a ete ecarte : il telecharge la base NVD entiere et exige desormais
      # une cle d'API, ce qui rend la construction lente et dependante d'un service tiers.
      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: datacom:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
