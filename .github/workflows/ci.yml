name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # Requis par dependency-review-action pour lire le differentiel de la proposition de fusion.
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # mvn verify runs: compile -> unit tests (Surefire) -> integration tests via
      # Testcontainers (Failsafe) -> Checkstyle -> JaCoCo coverage report (QUA-01/02/03).
      - name: Build, test, static analysis
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # SEC-12 : analyse des vulnerabilites a chaque integration, bloquante sur « critique ».
  #
  # Deux analyses complementaires plutot qu'une :
  #  - dependency-review compare les dependances ajoutees par la proposition de fusion et refuse
  #    d'en introduire une vulnerable. Il ne s'execute que sur une pull request, puisqu'il raisonne
  #    sur un differentiel.
  #  - Trivy analyse l'image construite : il couvre aussi les paquets du systeme de base, qu'aucune
  #    analyse des dependances Maven ne verrait, et s'execute sur chaque poussee.
  #
  # OWASP dependency-check a ete ecarte : il telecharge la base NVD entiere et exige desormais une
  # cle d'API, ce qui rend la construction lente et dependante d'un service tiers.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build container image
        run: docker build -t datacom:ci .

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: datacom:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
